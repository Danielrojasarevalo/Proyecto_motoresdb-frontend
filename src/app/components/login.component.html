<div class="min-h-screen bg-linear-to-br from-sky-50 via-sky-100 to-sky-200 text-slate-900 flex items-center justify-center px-4 py-8">
  <div class="w-full max-w-xl overflow-hidden rounded-[32px] border border-slate-200/70 bg-white shadow-2xl shadow-slate-400/20">
    <div class="bg-sky-700 px-8 py-10 text-center">
      <p class="text-xs uppercase tracking-[0.3em] text-sky-100/80">VillaMar | Inventario</p>
      <h1 class="mt-4 text-4xl font-semibold text-white">Acceso seguro</h1>
      <p class="mx-auto mt-3 max-w-md text-sm text-sky-100/90">Ingresa con tus credenciales para abrir el panel administrativo.</p>
    </div>

    <div class="p-8 sm:p-10">
      <form (ngSubmit)="onSubmit()" class="space-y-5">
        <div>
          <label class="text-sm font-medium text-slate-700" for="email">Ingresar correo</label>
          <input
            id="email"
            type="email"
            [(ngModel)]="email"
            name="email"
            required
            placeholder="Ingresa tu correo"
            class="mt-3 w-full rounded-3xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none transition duration-200 focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20"
          />
        </div>

        <div>
          <label class="text-sm font-medium text-slate-700" for="password">Contraseña</label>
          <input
            id="password"
            type="password"
            [(ngModel)]="password"
            name="password"
            required
            placeholder="Ingresa tu contraseña"
            class="mt-3 w-full rounded-3xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none transition duration-200 focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20"
          />
        </div>

        <div *ngIf="errorMessage" class="rounded-3xl border border-rose-500/30 bg-rose-500/10 p-3 text-sm text-rose-700">
          {{ errorMessage }}
        </div>

        <button
          type="submit"
          class="w-full rounded-3xl bg-sky-700 px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-sky-700/20 transition duration-200 hover:-translate-y-0.5 hover:bg-sky-800"
        >
          Ingresar al panel
        </button>

        <div class="mt-4 text-center">
          <a
            href="http://localhost:8000/admin"
            target="_blank"
            rel="noreferrer"
            class="text-sm font-medium text-sky-700 hover:text-sky-900"
          >
            Ir al panel de superusuario
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
